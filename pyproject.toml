[project]
name = "tacticmind"
version = "1.0.0"
description = "TacticMind — a chess tactics trainer with its own AI engine that thinks out loud"
requires-python = ">=3.11"
dependencies = ["chess>=1.10", "pywebview>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
# SIM109/SIM110: in the engine's hot loops, explicit comparisons and loops are faster than any()/tuples.
ignore = ["E501", "SIM108", "SIM109", "SIM110", "B023", "B905"]

[[tool.mypy.overrides]]
# Only scripts/trace_pieces.py uses them, and only when the pieces are traced again (not installed in CI).
module = ["numpy", "numpy.*", "PIL", "PIL.*", "vtracer"]
ignore_missing_imports = true
